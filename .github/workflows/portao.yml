name: portao

on:
  push:
  pull_request:

concurrency:
  group: portao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fase-1:
    name: Fase 1 — Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: dart format --set-exit-if-changed
        run: dart format --set-exit-if-changed .

      - name: flutter test
        run: flutter test

      - name: flutter build apk --debug
        run: flutter build apk --debug

# Fase 2 (a partir do ciclo 5, quando api/ existir): mypy --strict, ruff check, pytest.
# Não adicionar antes: portão que roda sobre pasta vazia dá falso verde.
